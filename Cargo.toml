[package]
name = "karaconf"
version = "0.1.0"
authors = ["Daichi Hioki <hioki.daichi@gmail.com>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order keeps karabiner.json's existing key order when it is round-tripped as a Value.
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
